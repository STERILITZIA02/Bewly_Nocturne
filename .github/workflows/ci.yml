name: CI

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - docs/**

  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - docs/**

jobs:
  pr-policy:
    name: PR policy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Check protected files and third-party dependencies
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pr-policy-check.mjs

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set project Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: |
            - args: [--frozen-lockfile]

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run lint

      - name: Dependency security audit
        run: pnpm audit --audit-level low

      - name: Type check
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run typecheck

      - name: Test
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm test

      - name: Knip
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run knip

      - name: Build Extension
        run: pnpm build

      - name: Upload Chrome extension
        if: ${{ matrix.os == 'ubuntu-latest' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bewly-Nocturne-chrome-extension
          path: extension
