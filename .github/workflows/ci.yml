name: CI

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - docs/**

  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - docs/**

jobs:
  pr-policy:
    name: PR policy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Check protected files and third-party dependencies
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pr-policy-check.mjs

  checks:
    name: ${{ matrix.check }}
    strategy:
      matrix:
        check: [lint, typecheck, test, knip, build]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set project Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
          run_install: |
            - args: [--frozen-lockfile]

      - run: pnpm run ${{ matrix.check }}

      - name: Upload Chrome extension
        if: ${{ matrix.check == 'build' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bewly-Nocturne-chrome-extension
          path: extension

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
          run_install: |
            - args: [--frozen-lockfile]
      - run: pnpm verify:dependency-security
