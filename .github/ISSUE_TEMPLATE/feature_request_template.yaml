name: 功能请求
description: 提交新功能请求
title: '[功能请求] '
labels: [功能请求]
body:
  - type: dropdown
    id: module
    attributes:
      label: 功能涉及模块
      options:
        - 插件页面
        - B站页面
        - 其他
    validations:
      required: true

  - type: input
    id: page_url
    attributes:
      label: 页面地址
      description: 如果涉及特定页面，请提供页面地址
      placeholder: '例如：https://t.bilibili.com/'
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 需求描述
      description: 说明使用场景与期望的行为。
    validations:
      required: true

  - type: textarea
    id: existing_plugins
    attributes:
      label: 参考设计
      description: 可提供已有实现、截图或相关链接。
    validations:
      required: false
