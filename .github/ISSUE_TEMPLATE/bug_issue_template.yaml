name: 问题报告
description: 报告 Bewly Nocturne 的外观或交互问题。
labels: [BUG]

body:
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 填写扩展与浏览器版本，以及与问题相关的设置。
      value: |
        - Bewly Nocturne 版本：
        - 浏览器及版本：
        - 相关设置：
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 安装来源
      options:
        - 插件商店
        - GitHub
        - 自行编译
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与实际结果
      description: 写明页面地址、操作顺序和出现的问题，可附截图或视频。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: false

  - type: textarea
    id: comparison
    attributes:
      label: 补充信息
      description: 如已比较原版页面、其他主题或停用扩展后的结果，可在此补充。
    validations:
      required: false
