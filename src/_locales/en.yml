    line_keep_main: Lines · keep parent visible
    indent_only: Indent · no collapse
  comment_reply_pagination_mode:
    title: Tree reply pagination
    desc: Load more appends pages and keeps replies already read; native pagination shows only the current page
    load_more: Load more
    pagination: Native pagination
  adjust_comment_image_height: Adjust comment image height
  adjust_comment_image_height_desc: Automatically adjust comment image height to match actual aspect ratio and prevent distortion
  hide_comment_image_scrollbar: Hide page scrollbar in comment image preview
  hide_comment_image_scrollbar_desc: Hide the page scrollbar when opening a comment image preview so it does not appear beside the overlay
  video_player_scroll: Scroll after adjusting the display mode
  video_player_scroll_desc: >-
    When enabled, it will automatically scroll to the appropriate position when
    the default mode is widescreen and default.
  exit_bewly_widescreen_loading: Exit widescreen mode
  enlarge_favorite_dialog: Enlarge favorite dialog
  enlarge_favorite_dialog_desc: When enabled, the favorite dialog on video pages will be displayed in a larger size for easier viewing and management.
  external_watch_later_button: External watch later button
  external_watch_later_button_desc: Show a standalone Watch later button in the video toolbar. It displays the current state and can add or remove the video.
  show_vertical_video_zoom_button: Vertical video zoom button
  show_vertical_video_zoom_button_desc: Show zoom controls and the visible-area position control for vertical videos
  show_video_screenshot_button: Show player screenshot button
  show_video_screenshot_button_desc: Show a button in the video player controls for capturing the current video frame.
  group_fonts: Font
  group_visual_effects: Visual Effects
