local_loudness:
  title: 本機響度均衡 · 實驗
  enable: 開啟本機響度均衡
  description: 預設關閉，只喺呢部裝置啟用。為而家嘅音訊做局部自動增益，減少忽大忽細；開啟後可用播放器波形按鈕調整。
  target: 目標響度
  strength: 調整強度
  curve: 最近 60 次增益取樣
  limits: 呢個係按短時響度做嘅局部調整，唔係完整節目級 EBU R128 正規化；取樣峰值限制唔保證真峰值。關閉後會保留原聲旁路；要用返原生音效，請關閉本實驗再重新整理播放頁。
  state:
    off: 已關閉 · 原聲播放
    waiting: 等緊有效主媒體播放
    gesture: 請撳頁面或者播放掣，允許瀏覽器開始處理音訊
    active: 調整緊而家嘅音訊
    paused: 暫停、靜音或者跳轉中 · 暫停增益測量
    native-on: 原生響度均衡開咗，請先喺原生播放器設定關閉
    native-unknown: 未能確認原生音效狀態，保持原聲播放
    source-in-use: 媒體已由原生音效或者其他擴充功能接管，保留原有音訊路徑。如果啱啱關咗原生音效，請重新整理播放頁再試。
    unsupported: 而家嘅媒體或瀏覽器未能安全接入，保持原聲播放
    error: 處理失敗，已用返原聲旁路；重新啟用可以重試
    reload-required: 音源出現衝突或者相容條件改咗，需要重新初始化。請關閉本實驗並重新整理播放頁，再繼續播放或者用原生音效。
