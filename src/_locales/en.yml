local_loudness:
  title: Local loudness · Experimental
  enable: Enable local loudness levelling
  description: "Off by default and enabled on this device only. Local automatic gain reduces short-term loudness swings. When enabled, use the player's waveform button to adjust it."
  target: Target loudness
  strength: Adjustment strength
  curve: Last 60 gain samples
  limits: 'Short-term local gain adjustment, not whole-programme EBU R128 normalization. The sample-peak limiter does not guarantee true peaks. Disabling retains an original-audio bypass. To use native audio effects, disable this experiment and reload the player page.'
  state:
    off: Off · Original audio
    waiting: Waiting for the active main media to play
    gesture: Click the page or Play to let the browser start audio processing
    active: Adjusting the current audio
    paused: 'Paused, muted or seeking · Measurement paused'
    native-on: Native loudness is enabled. Turn it off in the native player settings first.
    native-unknown: Native audio-effect state is unknown. Original audio is preserved.
    source-in-use: Native effects or another extension already owns this source. Its routing is preserved. If you just disabled native effects, reload the player page and retry.
    unsupported: This media or browser cannot be connected safely. Original audio is preserved.
    error: Processing failed. Original-audio bypass is active; toggle off and on to retry.
    reload-required: The source has a conflict or its compatibility has changed. Disable this experiment and reload the player page before continuing playback or using native effects.
