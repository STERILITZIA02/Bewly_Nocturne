  auto_hide_sidebar: Automatically hide the sidebar
  theme: Theme
  theme_opt:
    light: Light
    dark: Dark
    auto: Device
    scheduled: Scheduled
  theme_schedule: Light mode hours
  theme_schedule_desc: Use light mode during this time range and dark mode outside it.
  video_page_dark_mode: Video page dark mode only
  video_page_dark_mode_desc: Keep the global theme unchanged and enable Bewly Nocturne dark styles only on video playback pages.
  theme_color: Theme color
  dark_mode_base_color: Dark mode base color
  enable_oled_dark_mode: OLED pure black mode
  enable_oled_dark_mode_desc: Only applies while the effective theme is dark; page backgrounds become pure black while cards and overlays keep their layers.
  gradient_theme_color_background: Use theme color gradient in dark mode
  gradient_theme_color_background_desc: Apply it to both the page background and top bar.
  customize_css: Customize CSS
  customize_css_desc: >-
    If you are unfamiliar with CSS, please DO NOT modify CSS. Doing so may cause
    unexpected display issues.

    If you encounter any problems after modifying CSS, please reinstall
    BewlyBewly.
  logo_color: Logo color
  logo_color_opt:
    white: White
    theme_color: Theme Color
  search_results_pagination_mode_opt:
    scroll: Infinite Scroll
    pagination: Pagination
  enable_logo_glowing_effect: Enable glowing effect for the logo
  logo_visibility: Logo visibility
  disable_search_focus_effect: Remove search focus effect
  disable_search_focus_effect_desc: When enabled, focusing the search bar no longer blurs or darkens the page background.
  choose_search_bar_focused_character: Choose the character that appears when the search bar is focused
  show_hot_search_in_top_bar: Show trending searches
  show_hot_search_in_top_bar_desc: Display trending searches when the search box is focused
  show_hot_search_in_search_page: Show hot search in search page
  show_hot_search_in_search_page_desc: Display hot search ranking on the search page
  show_search_recommendation: Show search recommendation
  show_search_recommendation_desc: Display recommended search terms as placeholder in the search box, and search for them when pressing Enter with an empty input
  enable_search_history: Enable search history
  enable_search_history_desc: When enabled, the search bar will record and display your search history. Disabling this will clear all history
  use_plugin_search_results_page: Use plugin search results page
  use_plugin_search_results_page_desc: When enabled, searches will use the plugin's built-in search results page with category filtering and more features
  depersonalize_search_results: Depersonalized search
  depersonalize_search_results_desc: When enabled, search result requests are sent without login cookies.
  search_results_pagination_mode: Search results pagination mode
  search_results_pagination_mode_desc: 'Choose how search results are displayed: infinite scroll or page-based navigation'
  recommendation_mode: Recommendation mode
  recommendation_mode_desc: >
    Web: normal web recommendation mode. No Cookie: request homepage
    recommendations without cookies. App: mobile recommendation mode, requires
    an access key first.
  recommendation_mode_web_no_cookie: No Cookie
  remember_no_cookie_recommendation_state: Reduce No Cookie recommendation repeats
  remember_no_cookie_recommendation_state_desc: After reloading the page, continue the recommendation refresh progress and send recent exposure records with recommendation requests to reduce repeats. Only applies in No Cookie mode.
  auto_switch_recommendation_mode: Auto switch recommendation mode
  auto_switch_recommendation_mode_desc: >
    Automatically switch from App mode to Web mode when App recommendation fails.
  authorize_app: Authorize the BewlyBewly to use the access key
  authorize_app_desc: >
    After authentication, you will receive the video recommendations based on
    the bilibili app recommendation algorithm. The access key is valid for about
    one month. After that, remember to re-authorize the BewlyBewly to use the
    access key.
  authorize_app_more_info_access_key: More information about the access key
  scan_qrcode_desc: >-
    Use the Bilibili mobile app to scan this QR code in order to authorize the
    access key.
  disable_filters_for_followed_users: Disable filters for followed users
  disable_filters_for_followed_users_desc: >
    If you enable this option, all filters you set will be disabled for the
    users you follow.
  filter_out_vertical_videos: Filter out vertical videos (only works on the app recommendation mode)
  filter_by_view_count: Filter by view count
  filter_by_view_count_desc: Filtered out videos with less than the view count you set.
  filter_by_view_count_unit: views
  filter_by_like_count: Filter by like count
  filter_by_like_count_desc: Filter out videos with fewer likes than you set.
  filter_by_like_count_unit: likes
  filter_by_duration: Filter by duration
  filter_by_duration_desc: Filtered out videos with less than the duration you set.
  filter_by_duration_unit: sec
  filter_by_publish_time: Filter by publish time
  filter_by_publish_time_desc: Filter out videos published more than the specified number of days ago (only works in Web recommendation mode, minimum 7 days).
  filter_by_publish_time_unit: days
  filter_item_already_exist: This filter item already exists!
  filter_by_title: Filter by title
  filter_by_title_desc: >-
    Filtered out the videos that contain the titles you set (case-insensitive).
    Alternatively, use regex, such as {regex}, wrapped in {slash}.{lineBreak}
    In the table below, you can press the {enter} key to add a new filter or confirm a modification.
    Press the {esc} key to cancel the modification. Double-click the column to edit the current column.
  filter_by_user: Filter by user
  filter_by_user_desc: >-
    Filtered out the videos that are uploaded by the username (full name, case-insensitive) or MID you set.
    Alternatively, use regex, such as {regex}, wrapped in {slash}.{lineBreak}
    In the table below, you can press the {enter} key to add a new filter or confirm a modification.
    Press the {esc} key to cancel the modification. Double-click the column to edit the current column.
  filter_by_user_table:
    username_or_mid: Username / MID
  following_tab_show_livestreaming_videos: Show Live-streaming videos in the "Following" tab
  following_filter_charging_videos: Filter charging exclusive videos
  following_filter_charging_videos_desc: When enabled, paid videos that require charging to watch will be hidden in the "Following" page
  following_filter_dynamic_videos: Filter dynamic videos
  following_filter_dynamic_videos_desc: When enabled, videos marked as dynamic videos will be hidden in the "Following" page
  use_following_new_layout: Use new layout for Following tab
  use_following_new_layout_desc: Display followed UPs list on the left and video feed on the right
  collected_season_play_all_mode: Collected series Play All start position
  collected_season_play_all_mode_desc: Controls Play All start position for collected series on Favorites, Top Bar, and the native space page. Defaults to series beginning; falls back to beginning if last watched is not found. Does not change list order or playlist direction.
  collected_season_play_all_mode_beginning: Series beginning
  collected_season_play_all_mode_latest: Latest episode
  collected_season_play_all_mode_last_watched: Last watched
  enable_version_reminder: New version reminders
  enable_version_reminder_desc: Show unacknowledged version updates on the extension home page; each version is shown only once.
  enable_following_inactive_blacklist: Enable Inactive List
  enable_following_inactive_blacklist_desc: When a UP has not posted for the specified number of days or has no videos, they will be automatically moved to the Inactive List. They will be removed from the Inactive List when appearing in ALL view or when clicked
  following_inactive_days: UP inactive days
  following_inactive_days_desc: The feature takes effect after applying 'Use new layout for Following tab' It is unrelated to the custom user blacklist and only modifies recommendations within the 'new layout for Following tab' module.
  preserve_for_you_state: Preserve "For You" pre-switch state
  preserve_for_you_state_desc: When switching from dock to other pages, preserve the browsing state of the "For You" page and maintain content before switching when returning
  show_standalone_search_page: Show standalone search page
  show_standalone_search_page_desc: When disabled, search is integrated into Home and hidden from the Dock.
  home_tabs_adjustment: Tabs adjustment
  home_tabs_adjustment_desc: The first activated tab is the default page.
  fixed_home_tabs_on_home_page: Fix home tabs to the top
  adapt_to_other_page_styles: Adapt to other page styles
  adapt_to_other_page_styles_desc: Adapt to some common pages to match with the BewlyBewly theme.
  prevent_mobile_redirect: Prevent mobile redirect
  prevent_mobile_redirect_desc: When enabled, a desktop UA is used only for www.bilibili.com to prevent redirects to m.bilibili.com. Direct visits to the mobile site are unaffected.
  links: Links
  import_settings: Import Settings
  export_settings: Export Settings
  export_settings_desc: >-
    Some sensitive content, such as access key, will not be exported and may
    need to be reacquired again.
  reset_settings: Reset Settings
  reset_settings_confirm: >-
    Reset settings?

    This operation cannot be reversed. Are you sure you want to reset your
    settings?
  current_contributors: Bewly Nocturne Contributors (including BewlyBewly)
  contributors_image_failed: Contributor image failed to load
  enable_settings_sync: Allow syncing settings
  enable_settings_sync_desc: >-
    Save settings locally and to browser cloud storage. Per-device playback
    state is not synced (requires signing in to the browser account).
  settings_sync_unsynced_count: 'Unsynced fields: {count}'
  settings_sync_quota_blocked_count: 'Blocked by cloud quota: {count}'
  settings_sync_last_error: 'Last sync error: {error}'
  disable_auto_play_collection: Auto disable collection autoplay
  disable_auto_play_collection_desc: Automatically turn off the autoplay feature for video collections
  keep_collection_video_default_mode: Keep collection videos in default mode
  keep_collection_video_default_mode_desc: >-
    When enabled, collection videos will always use the default player mode and
    won't apply widescreen or fullscreen settings
  keep_watch_later_video_default_mode: Keep Watch Later videos in default mode
  keep_watch_later_video_default_mode_desc: >-
    When enabled, videos played from Watch Later will always use the default
    player mode and won't apply widescreen or fullscreen settings
  remember_playback_rate: Remember playback rate
  remember_playback_rate_desc: >
    When enabled, the player will remember your last set playback rate and
    automatically apply it when opening videos
  remember_video_aspect_ratio: Remember video aspect ratio
  remember_video_aspect_ratio_desc: >
    When enabled, the player will remember your last selected video aspect ratio
    and automatically apply it when opening videos
  auto_exit_fullscreen_on_end: Auto exit fullscreen/webFullscreen when video ends
  auto_exit_fullscreen_on_end_desc: >
    When enabled, the player will automatically exit fullscreen mode when the video finishes playing and no single-loop, random-play, or auto-play behavior is active
  auto_exit_fullscreen_exclude_auto_play: Exclude auto-play mode
  auto_exit_fullscreen_exclude_auto_play_desc: >
    When enabled, videos in auto-play mode will not auto-exit fullscreen when finished, allowing continuous viewing
  use_bilibili_default_auto_play: Use Bilibili's default auto-play behavior
  use_bilibili_default_auto_play_desc: >
    Let Bilibili decide what happens when playback ends instead of applying the per-video-type settings below.
  auto_play_watch_later: Watch Later
  auto_play_mode_default: Bilibili Default
  auto_play_mode_auto_play: Auto-play
  auto_play_mode_auto_play_with_recommend: Play recommendations
  auto_play_mode_pause_at_end: Pause at End
  auto_play_mode_loop: Single Loop
  auto_play_multipart: Multi-part Videos
  auto_play_multipart_desc: Choose auto-play behavior for multi-part videos. "Play recommendations" continues with recommended videos after the current video ends.
  auto_play_collection: Collection Videos
  auto_play_collection_desc: Choose auto-play behavior for collection videos. "Play recommendations" continues with recommended videos after the current video ends.
  auto_play_recommend: Recommended Videos
  auto_play_recommend_desc: Choose auto-play behavior when video ends. "Play recommendations" continues with recommended videos after the current video ends.
  auto_play_playlist: Playlist Videos
  auto_play_playlist_desc: Choose auto-play behavior for playlist videos. "Play recommendations" continues with recommended videos after the current video ends.
  enable_random_play: Enable custom playback for video collections
  enable_random_play_desc: Add sequential, reverse, and random playback plus playlist editing to multi-part videos, collections, Watch Later, and playlists.
  default_custom_play_order: Default custom playback option
  default_custom_play_order_desc: Only controls the order selected by default in the player, not the switch state. Per-video-type defaults override it when enabled.
  enable_custom_play_order_overrides: Set custom playback defaults by video type
  enable_custom_play_order_overrides_desc: Choose a separate default custom playback option for each supported playback context.
  custom_play_order_overrides: Per-video-type defaults
  custom_play_order_overrides_desc: Inherit Default uses the default custom playback option above.
  custom_play_order_inherit: Inherit Default
  random_play_mode: Random play activation
  random_play_mode_desc: Keep random playback off until manually enabled, or enable it automatically when the playlist reaches the configured size.
  random_play_mode_manual: Manual toggle
  random_play_mode_auto: Auto enable
  min_videos_for_random: Minimum videos for random play
  min_videos_for_random_desc: Only applies when random playback uses automatic activation
  random_play: Custom Playback
  random_play_order_sequential: Play in order
  random_play_order_reverse: Play in reverse
  random_play_order_random: Shuffle
  random_play_edit_playlist: Edit playlist
  random_play_finish_editing: Finish editing playlist
  random_play_edit_playlist_desc: Enter edit mode, then drag Bilibili episode items directly to change playback order.
  random_play_edit_playlist_empty: There is no editable playlist on this page
  random_play_edit_playlist_save: Save
  random_play_edit_playlist_cancel: Cancel
  random_play_enabled: Custom playback enabled
  random_play_disabled: Custom playback disabled
  random_play_not_enabled: Custom playback is not enabled
  random_play_min_videos_required: At least {count} videos required to enable random play
  enable_undo_refresh_button: Enable Undo Refresh Button(only effective in Web recommendation mode)
  enable_undo_refresh_button_desc: >-
    After refreshing the page, display an undo button that restores the content
    before the refresh when clicked.
  clean_url_argument: Clean URL Tracking Parameters
  clean_url_argument_desc: Automatically clean tracking parameters from URLs to make links cleaner

  # Clean Share Link
  group_clean_share_link: Clean Share Link
  enable_clean_share_link: Enable clean share link
  enable_clean_share_link_desc: >
    When enabled, the share link will be cleaned by removing tracking parameters and optionally including the video title.
    This applies to Bewly Nocturne's copy link feature and intercepts Bilibili's native share button.
  clean_share_link_include_title: Include video title in shared link
  clean_share_link_include_title_desc: >
    When sharing, the video title will be added before the link, e.g. "Video Title https://www.bilibili.com/video/BVxxx"
  clean_share_link_remove_tracking_params: Remove tracking parameters from link
  clean_share_link_remove_tracking_params_desc: >
    Remove tracking parameters like spm_id_from, vd_source, share_source, etc. from the share link.

  show_ip_location: Show IP home location
  show_ip_location_desc: Display IP home in the video/dynamic comment area
  show_sex: Show user gender
  show_sex_desc: Display user gender in the video/dynamic comment area
  show_comment_host_tag: Show OP tag
  show_comment_host_tag_desc: Show an OP tag on the root comment in reply detail view
  enable_comment_reply_tree_display: Comment tree view
  enable_comment_reply_tree_display_desc: Organize nested replies by reply relationship. When off, comments are not reordered, indented, or decorated with reply-tree guides
  comment_reply_tree_mode:
    title: Comment reply tree style
    desc: Group replies by parent and posting time. Line modes let you collapse any parent’s replies. “Collapse parent” also folds the parent body; “Keep parent” leaves the parent visible and only hides its replies
